name: Terbitkan dashboard demo

on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/build_pages.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
   cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pasang alat build
        run: npm ci --no-audit --no-fund

      - name: Siapkan folder situs
        run: |
          node tools/build_pages.mjs _site
          rm -rf _site/img
          if grep -q "url: 'https://script.google.com/" site/js/deploy.js; then
            rm -rf _site/data
            echo "Mode login: data dikirim KPR API setelah login, folder data tidak ikut diterbitkan."
          elif ! grep -q '"is_dummy":true' _site/data/meta.json; then
            echo "::error::Data di site/data bukan data dummy. Penerbitan dibatalkan."; exit 1
          fi
          if find _site -type f \( -name '*.xlsx' -o -name '*.csv' \) | grep -q .; then
            echo "::error::Ada file Excel atau CSV di folder situs. Penerbitan dibatalkan."; exit 1
          fi
          if ! grep -q "script-src 'self';" _site/index.html || grep -q 'onerror=\|onclick=\|onload=' _site/index.html; then
            echo "::error::Aturan keamanan CSP di index.html dilonggarkan. Penerbitan dibatalkan."; exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
