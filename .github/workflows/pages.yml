name: Terbitkan dashboard demo

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan folder situs (data dummy)
        run: |
          cp -r site _site
          rm -rf _site/img
          if ! grep -q '"is_dummy":true' _site/data/meta.json; then
            echo "::error::Data di site/data bukan data dummy. Penerbitan dibatalkan."; exit 1
          fi
          if find _site -type f \( -name '*.xlsx' -o -name '*.csv' \) | grep -q .; then
            echo "::error::Ada file Excel atau CSV di folder situs. Penerbitan dibatalkan."; exit 1
          fi
          if grep -q "url: 'https://script.google.com/" _site/js/deploy.js; then
            echo "::error::Versi demo harus memakai data dummy lokal. Kosongkan API.url di site/js/deploy.js."; exit 1
          fi
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
