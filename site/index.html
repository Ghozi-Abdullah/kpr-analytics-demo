<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com ws://127.0.0.1:* ws://localhost:*; base-uri 'self'; form-action 'none'">
  <title>KPR Analytics</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="lib/fonts/google-sans-flex-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="lib/fonts/google-sans-flex-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/main.css">
  <script src="lib/chart.umd.min.js"></script>
  <script src="lib/chartjs-plugin-datalabels.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app"><div class="boot" role="status">Memuat dashboard</div></div>
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML = '<div class="fatal" role="alert"><h2>Buka lewat Live Server</h2>'
        + '<p>Halaman ini dibuka langsung dari file, jadi data tidak bisa dibaca. Di VS Code, klik Go Live di status bar '
        + '(atau klik kanan file lalu pilih Open with Live Server).</p></div>';
    }
  </script>
</body>
</html>
